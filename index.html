<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>AzMessage - Hızlı Yönlendirici</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px 16px;
            position: relative;
            overflow-x: hidden;
        }

        /* Arka Plan Süsleme Efektleri */
        .bg-glow-1 {
            position: absolute;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(37, 211, 102, 0.15) 0%, rgba(15, 23, 42, 0) 70%);
            z-index: 0;
            pointer-events: none;
        }

        .bg-glow-2 {
            position: absolute;
            bottom: -100px;
            right: -50px;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(0, 136, 204, 0.12) 0%, rgba(15, 23, 42, 0) 70%);
            z-index: 0;
            pointer-events: none;
        }

        .main-wrapper {
            width: 100%;
            max-width: 440px;
            margin: auto 0;
            z-index: 1;
        }

        .card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 36px 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.08);
            text-align: center;
        }

        /* Logo Simgesi */
        .app-icon {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, #25D366, #128C7E);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px auto;
            box-shadow: 0 8px 20px rgba(37, 211, 102, 0.3);
        }

        .app-icon svg {
            width: 38px;
            height: 38px;
            fill: #ffffff;
        }

        .logo-title {
            font-size: 26px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        /* Arama Kutusu */
        .search-box {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            width: 100%;
        }

        .search-input {
            flex: 1;
            padding: 14px 16px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            transition: all 0.2s ease;
            background-color: rgba(15, 23, 42, 0.6);
            color: #ffffff;
        }

        .search-input::placeholder {
            color: #64748b;
        }

        .search-input:focus {
            border-color: #25D366;
            box-shadow: 0 0 0 3px rgba(37, 211, 102, 0.2);
        }

        .search-btn {
            padding: 14px 20px;
            background-color: #25D366;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            font-size: 15px;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .search-btn:active {
            transform: scale(0.97);
            background-color: #1ebe5d;
        }

        /* Spinner */
        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #25D366;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 16px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Butonlar */
        .btn {
            display: none;
            width: 100%;
            padding: 15px;
            margin-top: 12px;
            background-color: #25D366;
            color: #ffffff;
            text-decoration: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(37, 211, 102, 0.3);
        }

        .btn:active {
            transform: scale(0.98);
            background-color: #1ebe5d;
        }

        .btn-secondary {
            background-color: rgba(255, 255, 255, 0.08);
            color: #e2e8f0;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: none;
        }

        .btn-secondary:active {
            background-color: rgba(255, 255, 255, 0.15);
        }

        /* Durum Mesajları */
        .status-box {
            font-size: 13.5px;
            font-weight: 600;
            padding: 12px;
            border-radius: 10px;
            margin-top: 8px;
        }

        .error-box { color: #f87171; background-color: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2); }
        .success-box { color: #4ade80; background-color: rgba(34, 197, 94, 0.1); border: 1px solid rgba(34, 197, 94, 0.2); }
        .warning-box { color: #fbbf24; background-color: rgba(245, 158, 11, 0.1); border: 1px solid rgba(245, 158, 11, 0.2); }

        /* Özellik Rozetleri (Boşluğu Doldurmak İçin) */
        .features {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #94a3b8;
        }

        .feature-item svg {
            width: 14px;
            height: 14px;
            fill: #25D366;
        }

        /* Footer */
        footer {
            z-index: 1;
            margin-top: 20px;
            font-size: 12px;
            color: #64748b;
            text-align: center;
        }

        @media (max-width: 480px) {
            .search-box {
                flex-direction: column;
            }

            .search-btn {
                width: 100%;
                padding: 14px;
            }
        }
    </style>
</head>
<body>

    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>

    <div class="main-wrapper">
        <div class="card">
            <!-- App Logo İkonu -->
            <div class="app-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/>
                </svg>
            </div>

            <h1 class="logo-title">AzMessage</h1>

            <div id="searchContainer" class="search-box" style="display: none;">
                <input type="text" id="usernameInput" class="search-input" placeholder="Kullanıcı adı yazın (@ornek)..." autocomplete="off" spellcheck="false" />
                <button id="searchBtn" class="search-btn">Ara</button>
            </div>
            
            <div id="loader" class="spinner" style="display: none;"></div>
            <p id="infoText" class="subtitle">Cihaz kontrol ediliyor...</p>

            <a href="#" id="openAppBtn" class="btn">Uygulamayı Aç</a>
            <a href="https://mehemmed988.github.io/AzMessageWeb/" id="fallbackBtn" class="btn btn-secondary">Web Sitesine Git</a>

            <!-- Özellik Rozetleri -->
            <div class="features">
                <div class="feature-item">
                    <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/></svg>
                    Güvenli Yönlendirme
                </div>
                <div class="feature-item">
                    <svg viewBox="0 0 24 24"><path d="M13 2.05v3.03c3.39.49 6 3.39 6 6.92 0 .9-.18 1.75-.48 2.54l2.6 1.53c.56-1.24.88-2.62.88-4.07 0-5.18-3.95-9.45-9-9.95zM12 19c-3.87 0-7-3.13-7-7 0-3.53 2.61-6.43 6-6.92V2.05C5.95 2.55 2 6.82 2 12c0 5.52 4.48 10 10 10 2.04 0 3.93-.62 5.51-1.68l-2.22-1.88C14.3 18.77 13.18 19 12 19z"/></svg>
                    Hızlı Bağlantı
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; AzMessage Messenger</p>
    </footer>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <script>
        function isAndroidMobileOrTablet() {
            var ua = (navigator.userAgent || navigator.vendor || window.opera).toLowerCase();

            if (!ua.includes("android")) {
                return false;
            }

            var isTv = ua.includes("tv") || 
                       ua.includes("googletv") || 
                       ua.includes("smarttv") || 
                       ua.includes("androidtv") || 
                       ua.includes("hbbtv") || 
                       ua.includes("crkey") || 
                       ua.includes("aftt") ||  
                       ua.includes("aftm");

            if (isTv) {
                return false;
            }

            if (navigator.userAgentData && navigator.userAgentData.platform) {
                if (navigator.userAgentData.platform.toLowerCase() !== 'android') {
                    return false;
                }
            }

            return true;
        }

        var mainWebSiteUrl = "https://mehemmed988.github.io/AzMessageWeb/"; 
        var baseSchemeUrl = "azapp://open";

        var infoText = document.getElementById("infoText");
        var openAppBtn = document.getElementById("openAppBtn");
        var fallbackBtn = document.getElementById("fallbackBtn");
        var loader = document.getElementById("loader");
        var searchContainer = document.getElementById("searchContainer");
        var usernameInput = document.getElementById("usernameInput");
        var searchBtn = document.getElementById("searchBtn");

        function setStatus(text, typeClass) {
            infoText.className = "subtitle " + (typeClass || "");
            infoText.innerText = text;
        }

        if (!isAndroidMobileOrTablet()) {
            setStatus("Bu uygulama ve yönlendirme yalnızca Android telefon ve tabletlerde çalışmaktadır.", "status-box warning-box");
            fallbackBtn.style.display = "block";
        } else {
            searchContainer.style.display = "flex";
            setStatus("Kullanıcı arayabilir veya doğrudan uygulamayı açabilirsiniz.");

            var firebaseConfig = {
                apiKey: "AIzaSyCyloxmk4_L4_WKeXi6w8gimoFGNfdPz3o",
                authDomain: "azmessage-1998.firebaseapp.com",
                databaseURL: "https://azmessage-1998-default-rtdb.firebaseio.com",
                projectId: "azmessage-1998",
                storageBucket: "azmessage-1998.firebasestorage.app",
                messagingSenderId: "989356500260",
                appId: "1:989356500260:web:23c01bdabaff85555bbfb1",
                measurementId: "G-8CBX47S3BR"
            };

            firebase.initializeApp(firebaseConfig);
            var db = firebase.database();
            var auth = firebase.auth();

            function bindManualOpenHandler(schemeUrl) {
                openAppBtn.onclick = function(e) {
                    e.preventDefault();
                    
                    var appOpened = false;
                    var redirectTimer = null;

                    function handleVisibilityChange() {
                        if (document.hidden) {
                            appOpened = true;
                            if (redirectTimer) clearTimeout(redirectTimer);
                            document.removeEventListener("visibilitychange", handleVisibilityChange);
                        }
                    }

                    document.addEventListener("visibilitychange", handleVisibilityChange);
                    window.location.href = schemeUrl;

                    redirectTimer = setTimeout(function() {
                        document.removeEventListener("visibilitychange", handleVisibilityChange);
                        if (!appOpened && !document.hidden) {
                            setStatus("Uygulama cihazınızda bulunamadı. Web sitesine yönlendiriliyorsunuz...", "status-box warning-box");
                            setTimeout(function() {
                                window.location.href = mainWebSiteUrl;
                            }, 1000);
                        }
                    }, 2500);
                };
            }

            function processUserSearch(targetUsername, autoTrigger) {
                if (!targetUsername || targetUsername.trim() === "") {
                    setStatus("Lütfen bir kullanıcı adı girin!", "status-box error-box");
                    return;
                }

                targetUsername = targetUsername.trim().replace("@", "");
                
                loader.style.display = "block";
                openAppBtn.style.display = "none";
                fallbackBtn.style.display = "none";
                setStatus("@" + targetUsername + " kontrol ediliyor...");

                auth.signInAnonymously()
                    .then(function() {
                        return db.ref('users').orderByChild('username').equalTo(targetUsername).once('value');
                    })
                    .then(function(snapshot) {
                        loader.style.display = "none";
                        var found = false;

                        if (snapshot.exists()) {
                            snapshot.forEach(function(child) {
                                if (child.val() && child.val().username === targetUsername) {
                                    found = true;
                                }
                            });
                        }

                        if (found) {
                            var targetSchemeUrl = baseSchemeUrl + "?user=" + encodeURIComponent(targetUsername);
                            
                            setStatus("@" + targetUsername + " kullanıcısı bulundu. Uygulama açılıyor...", "status-box success-box");
                            
                            openAppBtn.innerText = "@" + targetUsername + " Profilini Aç";
                            openAppBtn.style.display = "block";

                            bindManualOpenHandler(targetSchemeUrl);

                            if (autoTrigger) {
                                window.location.href = targetSchemeUrl;
                            }
                        } else {
                            loader.style.display = "none";
                            setStatus("@" + targetUsername + " adında bir kullanıcı bulunamadı!", "status-box error-box");
                            fallbackBtn.style.display = "block";
                        }
                    })
                    .catch(function(err) {
                        loader.style.display = "none";
                        setStatus("Bağlantı hatası oluştu.", "status-box error-box");
                        fallbackBtn.style.display = "block";
                    });
            }

            searchBtn.addEventListener("click", function() {
                processUserSearch(usernameInput.value, true);
            });

            usernameInput.addEventListener("keypress", function(e) {
                if (e.key === "Enter") {
                    processUserSearch(usernameInput.value, true);
                }
            });

            var urlParams = new URLSearchParams(window.location.search);
            var redirectPath = urlParams.get('redirect');
            var targetUsername = null;
            var isInvalid = false;

            if (urlParams.has('redirect')) {
                if (redirectPath && redirectPath.trim() !== "") {
                    var decodedRedirect = decodeURIComponent(redirectPath);
                    var pathSegments = decodedRedirect.split("/");
                    var userIndex = pathSegments.indexOf("user");
                    if (userIndex !== -1 && pathSegments[userIndex + 1]) {
                        targetUsername = pathSegments[userIndex + 1];
                    } else { isInvalid = true; }
                } else { isInvalid = true; }
            } else {
                var pathSegments = window.location.pathname.split("/");
                var userIndex = pathSegments.indexOf("user");
                if (userIndex !== -1 && pathSegments[userIndex + 1]) {
                    targetUsername = pathSegments[userIndex + 1];
                }
            }

            if (isInvalid) {
                setStatus("Geçersiz veya hatalı bağlantı adresi!", "status-box error-box");
                fallbackBtn.style.display = "block";
            } else if (targetUsername) {
                usernameInput.value = targetUsername;
                processUserSearch(targetUsername, true);
            } else {
                openAppBtn.innerText = "Uygulamayı Aç";
                openAppBtn.style.display = "block";
                bindManualOpenHandler(baseSchemeUrl);
            }
        }
    </script>
</body>
</html>
